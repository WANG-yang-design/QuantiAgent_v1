# =========================================================
# 数据源配置: 主源 + 备源 + 多源比对阈值
# 主源失败自动切换备源; 多源冲突触发 CONFLICT 质量标签
#
# 2026-08 修复: 东财/akshare 依赖的系统代理在本机不可用导致
# 数据获取几乎全部失败, 主源切换为直连/免费稳定通道:
#   - 历史日K: baostock/新浪等提供多年复权序列；腾讯客户端不提供多年历史
#   - 当日/缺口: tencent 第一优先，补历史源滞后的最后交易日
#   - 分钟K:   tencent(今日分时实时) + baostock(历史)
#   - 实时行情: tencent(qt.gtimg.cn CDN直连, 无代理)
#   - 盘口:     tencent(内置买卖五档)
#   - 全市场ETF列表/新闻/舆情: 仍用 akshare(有磁盘缓存)
# =========================================================

sources:
  # 2026-09 修复: 历史日K主源切换为新浪(直连, 单次可拉1023根≈4年, ETF/股票/指数
  # 通用), 腾讯 ifzq 因高频访问会被 501 反爬拦截(仍保留为备源, 恢复后其前复权
  # 数据优先级更高时可通过调整此顺序启用); baostock/akshare 兜底。
  # 原主源 baostock 对大量ETF无数据且慢, 返回部分数据后备源永不触发,
  # 造成"很多标的行情缺失/停在几周前"。
  daily_bar:
    primary: sina
    backups: [tencent, baostock, akshare]
  # 回测/历史数据的缺失日期逐源补齐
  daily_gap:
    primary: sina
    backups: [tencent, baostock, akshare]
  minute_bar:
    primary: tencent
    backups: [baostock, akshare]
  realtime_quote:
    primary: tencent
    backups: [eastmoney, sina, akshare]
  order_book:
    primary: tencent
    backups: [eastmoney, akshare]
  money_flow:
    primary: eastmoney
    backups: [akshare]
  news:
    primary: eastmoney
    backups: [akshare]
  announcement:
    primary: cninfo
    backups: [eastmoney]
  sentiment:
    primary: akshare
    backups: []
  trade_calendar:
    primary: baostock
    backups: [akshare, tushare]
  # 全市场ETF列表: 东财直连 clist(每页500只, 约4次请求) → 新浪ETF节点 → akshare
  etf_info:
    primary: eastmoney
    backups: [sina, akshare]
  fund_flow:
    primary: eastmoney
    backups: [akshare]

# 多源比对: 实时价偏差超过0.5%立即拒绝进入Agent/交易；
# 日线因复权/更新时间差异允许1%。
cross_source:
  close_price_diff_pct: 0.01
  quote_diff_pct: 0.005

# 数据新鲜度阈值(秒): 超过即 DELAYED
freshness:
  realtime_quote: 60
  daily_bar: 43200          # 12小时(收盘后更新)
  minute_bar: 600

# 采集限流(秒): 相邻两次采集的最小间隔
rate_limit:
  realtime_quote: 5
  order_book: 15
  news: 300
  money_flow: 60
