# =========================================================
# 数据源配置: 主源 + 备源 + 多源比对阈值
# 主源失败自动切换备源; 多源冲突触发 CONFLICT 质量标签
#
# 2026-08 修复: 东财/akshare 依赖的系统代理在本机不可用导致
# 数据获取几乎全部失败, 主源切换为直连/免费稳定通道:
#   - 日K:     baostock(前复权, 盘中即含当日K线)
#   - 分钟K:   tencent(今日分时实时) + baostock(历史)
#   - 实时行情: tencent(qt.gtimg.cn CDN直连, 无代理)
#   - 盘口:     tencent(内置买卖五档)
#   - 全市场ETF列表/新闻/舆情: 仍用 akshare(有磁盘缓存)
# =========================================================

sources:
  daily_bar:
    primary: baostock
    backups: [akshare, tencent, sina]
  minute_bar:
    primary: tencent
    backups: [baostock, akshare]
  realtime_quote:
    primary: tencent
    backups: [eastmoney, sina, akshare]
  order_book:
    primary: tencent
    backups: [eastmoney, akshare]
  money_flow:
    primary: eastmoney
    backups: [akshare]
  news:
    primary: eastmoney
    backups: [akshare]
  announcement:
    primary: cninfo
    backups: [eastmoney]
  sentiment:
    primary: akshare
    backups: []
  trade_calendar:
    primary: baostock
    backups: [akshare, tushare]
  etf_info:
    primary: akshare
    backups: []
  fund_flow:
    primary: eastmoney
    backups: [akshare]

# 多源比对: 两源收盘价相对偏差超过此阈值 → CONFLICT
cross_source:
  close_price_diff_pct: 0.01
  quote_diff_pct: 0.02

# 数据新鲜度阈值(秒): 超过即 DELAYED
freshness:
  realtime_quote: 60
  daily_bar: 43200          # 12小时(收盘后更新)
  minute_bar: 600

# 采集限流(秒): 相邻两次采集的最小间隔
rate_limit:
  realtime_quote: 5
  order_book: 15
  news: 300
  money_flow: 60
