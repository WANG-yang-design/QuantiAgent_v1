# =========================================================
# 多Agent量化交易系统 V1 - 全局配置
# =========================================================

system:
  name: "多Agent量化交易系统V1"
  version: "1.0.0"
  timezone: "Asia/Shanghai"
  trade_mode: "paper"            # paper=模拟盘 live=实盘(预留) backtest=回测
  log_dir: "logs"
  report_dir: "reports"

database:
  url: ""                        # 留空则从 .env 拼接
  echo: false
  pool_size: 10
  max_overflow: 20

# ---- 模拟盘初始资金 ----
paper_account:
  initial_cash: 100000
  account_id: "PA-001"

# ---- 标的池 ----
universe:
  # V1 优先 ETF；股票为 P1 可选
  etf_whitelist: []              # 空 = 从数据源拉取全部 ETF, 再按流动性过滤
  stock_whitelist: []
  max_symbols_per_scan: 20       # 盘中监控单轮最多分析标的数
  min_etf_amount: 50000000       # 最小日成交额(元), 过滤低流动性 ETF
  # ---- 智能扫描调度 (成本控制, 修复: 监控池全部标的每30分钟全量分析) ----
  # smart_scan=true 时: 持仓标的+近3日轮动交易过的标的 → 每轮都分析;
  # 其余监控标的 → 按 tier2_interval_rounds 轮询(每N轮覆盖一轮)。
  smart_scan: true
  tier2_interval_rounds: 4
  tier2_max_per_round: 8

# ---- LLM 调用 ----
llm:
  base_url: ""                   # 从 .env 覆盖
  api_key: ""
  fast_model: ""
  deep_model: ""
  embedding_model: ""
  temperature: 0.2
  max_retries: 3
  timeout_seconds: 60
  mock_mode: "auto"              # auto=无key自动降级为规则模拟; true=强制模拟; false=强制真实
  cost_log: true

# ---- 盘中监控 ----
intraday:
  analysis_interval_min: 30      # Agent 常规分析频率(可配5/10/15/30/60)
  urgent:
    price_change_pct_abs: 0.02   # 涨跌幅超过2%触发紧急分析
    volume_ratio_gt: 2.0
    intraday_drawdown_gt: 0.015
    order_book_spread_gt: 0.005
    major_news: true
    stop_loss_near: true

# ---- Agent 开关 (成本控制, 修复: 之前15个Agent全部无条件参与) ----
# 关闭的 Agent 不再调用 LLM(改用规则化输出占位, 决策链路保持完整)。
# 必须启用(禁关): data_admin(数据闸门)/chief_researcher(结论)/
#                trader(交易员)/risk_manager(风控)/compliance(合规)
# 建议: ETF 场景可关 fundamental(无基本面数据); 保守可关 sentiment/money_flow
agents:
  enabled:
    technical_analyst: true
    etf_analyst: true
    fundamental_analyst: true
    news_analyst: true
    sentiment_analyst: true
    money_flow_analyst: true
    macro_analyst: true
    bull_researcher: true
    bear_researcher: true

# ---- 策略参数 (无Agent参与时的规则策略, 见 strategies/rotation_executor.py) ----
strategies:
  etf_momentum_rotation:
    top_n: 3                 # 持有动量排名前N只
    mom_window: 20           # 动量计算窗口(交易日)
    min_amount: 30000000     # 20日均成交额下限(元), 低于则剔除
    max_vol: 0.50            # 年化波动率上限(过滤极端波动)
    target_weight: 0.20      # 单标的目标仓位(占总资产比例)
    rebalance_threshold: 0.15  # 仓位偏离超过15%才调仓(减少噪音交易)
    max_total_position: 0.90   # 总仓位上限(多只合计不得超过, 防止超配)
    stop_loss_pct: 0.08        # 单标的止损线(浮亏超8%当日收盘价止损, 不等次日)
    market_filter: true        # 市场风险过滤(池内中位动量为负时清仓防守)
    market_exit_threshold: -0.03  # 中位动量低于-3% → 清仓防守
    market_enter_threshold: -0.01  # 清仓后回升到-1%以上才允许重新开仓(滞回防反复)
    min_order_amount: 500       # 最小买入金额(元, 防100股碎单)
    warmup_days: 20             # 预热期(交易日, 引擎已预加载起点前历史数据)
    min_hold_days: 3            # 最小持仓天数(防"今天买明天卖")
    hold_buffer: 1              # 卖出滞回: 排名跌出前(top_n+1)才卖, 减少震荡进出
    max_buy_momentum: 0.25       # 追高保护: 20日涨幅超25%禁止买入(修复: 原30%仍常买在最高点)
    initial_ratio: 0.50          # 首仓比例: 首次买入只建目标仓位的50%(分批建仓)
    bottom_ratio: 0.20           # 底仓比例: 排名跌出时减仓至20%留观察仓, 不全清
    fresh_stop_mult: 1.5         # 新仓止损放宽: 持有<min_hold_days时止损线放宽倍数(8%→12%)
    # ---- 买点质量过滤(修复: 买在最高点→8%止损清仓的反复磨损) ----
    require_above_ma20: true     # 必须站上MA20才买(防下跌趋势中接刀)
    max_distance_from_ma20: 0.12 # 收盘价高出MA20超12%=短线过热, 不追
    # ---- 低位启动(修复: 纯动量排名漏掉刚启动的低位看涨标的) ----
    low_rebound_bonus: 0.015     # 距60日低点回升≥10%且站上MA20的标的, 排名动量+1.5%
    low_rebound_from_low_pct: 0.10
  # ---- 实盘轮动执行 (回测策略的落地应用, 见 strategies/live_rotation.py) ----
  live_rotation:
    enabled: true                # 每日14:40由调度器自动执行轮动调仓
    max_orders_per_day: 6        # 每日最多提交订单数(防失控)
    # params: {}                 # 可选: 覆盖上方 etf_momentum_rotation 参数

# ---- RAG ----
rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  vector_dim: 1024               # 与 embedding 模型输出维度一致
  embedding_batch_size: 10

# ---- Web 管理台 ----
web:
  host: "0.0.0.0"
  port: 8080
  # 邮件确认链接的对外地址(修复: 原写死127.0.0.1, 手机收到邮件点确认打不开)。
  # 局域网使用填 http://<本机IP>:8080; 留空则用 http://127.0.0.1:8080
  public_base_url: "http://10.67.249.226:8080"
  # 人工确认令牌(实测盘前应替换为正式鉴权)
  admin_token: "quantiagent-admin"
  # Web 启动时自动内嵌拉起调度器(默认true)。
  # 修复: 以前调度器依赖单独的 start.bat 窗口, 窗口一关/重启忘启动就整天无决策链。
  # 单例锁(data/scheduler.pid)保证全系统只有一个调度器实例, 重复启动自动退出。
  embed_scheduler: true
  # CORS 白名单(前端同源托管时无需跨域; 若需局域网访问请把访问地址加入列表)
  cors_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://10.67.249.226:8080"

# ---- 报告 ----
report:
  daily_time: "17:00"
  weekly_day: 5                  # 周五
  monthly_day: 1

# ---- 券商接口(实盘预留) ----
broker:
  adapter: "paper"               # paper | qmt | ptrade
  qmt_path: ""                   # QMT 安装目录(预留)
  qmt_account: ""
  ptrade_ip: ""
  ptrade_port: 0

